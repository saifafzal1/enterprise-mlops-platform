name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Smoke train heart disease (1 epoch equivalent)
        run: |
          mkdir -p data/raw models
          python -c "
          import pandas as pd, numpy as np, os
          cols = ['age','sex','cp','trestbps','chol','fbs','restecg','thalach','exang','oldpeak','slope','ca','thal','target']
          df = pd.DataFrame(np.random.rand(50, 14), columns=cols)
          df['target'] = (df['target'] > 0.5).astype(int)
          df.to_csv('data/raw/heart_disease.csv', index=False, header=False)
          "
          EPOCHS=1 python src/heart_disease/train.py

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            saifafzal1/enterprise-mlops:${{ github.sha }}
            saifafzal1/enterprise-mlops:latest

      - name: Smoke test container
        if: github.ref == 'refs/heads/main'
        run: |
          docker run -d -p 8000:8000 saifafzal1/enterprise-mlops:latest
          sleep 10
          curl --fail http://localhost:8000/health
